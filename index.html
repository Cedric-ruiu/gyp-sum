    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GypSum",
        "description": "Calculateur de dosage eau / plâtre pour moulage, basé sur la masse volumique du gypse (2,58 kg/L).",
        "url": "https://cedric-ruiu.github.io/gyp-sum/",

        "isAccessibleForFree": true,

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HowTo",
        "name": "Comment doser le plâtre pour un moulage",
        "description": "Calculez et préparez la bonne quantité de plâtre pour remplir votre moule sans gâchis, en cinq étapes.",
        "inLanguage": "fr-FR",
        "step": [
          { "@type": "HowToStep", "position": 1, "name": "Mesurer le volume du moule", "text": "Relevez les dimensions intérieures de votre coffrage (longueur, largeur, hauteur de remplissage souhaitée). C'est le volume total à remplir de plâtre." },
          { "@type": "HowToStep", "position": 2, "name": "Estimer le volume de la pièce à mouler", "text": "Si une pièce occupe le moule, soustrayez son volume. Choisissez la forme la plus proche, ou mesurez-le par immersion dans un récipient gradué." },
          { "@type": "HowToStep", "position": 3, "name": "Choisir le ratio plâtre / eau", "text": "Le ratio (kg de plâtre par litre d'eau) fixe la dureté : 1,3 pour un plâtre fin et fluide, 1,5 pour un usage courant, 1,8 pour un plâtre dur et résistant." },
          { "@type": "HowToStep", "position": 4, "name": "Ajouter une marge de sécurité", "text": "Prévoyez environ 10 % de matière en plus pour compenser les pertes (récipient, débordements, prise rapide)." },
          { "@type": "HowToStep", "position": 5, "name": "Mélanger et couler", "text": "Versez toujours le plâtre dans l'eau, jamais l'inverse. Laissez détremper sans remuer, puis mélangez et coulez avant le début de prise." }
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "inLanguage": "fr-FR",
        "mainEntity": [
          { "@type": "Question", "name": "Combien de plâtre faut-il pour un moule ?", "acceptedAnswer": { "@type": "Answer", "text": "Cela dépend du volume net à remplir (volume du moule moins celui de la pièce) et du ratio plâtre/eau. Renseignez vos dimensions : le calculateur affiche les quantités exactes d'eau et de plâtre, marge de sécurité comprise." } },
          { "@type": "Question", "name": "Quel est le bon ratio plâtre / eau ?", "acceptedAnswer": { "@type": "Answer", "text": "Le ratio s'exprime en kilos de plâtre par litre d'eau. Comptez 1,3 pour un plâtre fluide et détaillé, 1,5 pour un usage standard, et 1,8 pour un plâtre dur et résistant. Plus le ratio est élevé, plus le plâtre est dense et solide." } },
          { "@type": "Question", "name": "Faut-il verser le plâtre dans l'eau ou l'eau dans le plâtre ?", "acceptedAnswer": { "@type": "Answer", "text": "Toujours le plâtre dans l'eau, jamais l'inverse. Saupoudrez le plâtre progressivement, laissez-le détremper quelques minutes, puis mélangez pour éviter les grumeaux." } },
          { "@type": "Question", "name": "Quelle est la masse volumique du plâtre ?", "acceptedAnswer": { "@type": "Answer", "text": "Le calcul repose sur la masse volumique du gypse (sulfate de calcium) : 2,58 kg/L. C'est une constante physique, identique quel que soit le type de plâtre. Elle permet un dosage plus précis qu'un simple ratio volumique." } },
          { "@type": "Question", "name": "Comment mesurer le volume d'une pièce de forme irrégulière ?", "acceptedAnswer": { "@type": "Answer", "text": "Plongez la pièce dans un récipient gradué rempli d'eau et notez la montée du niveau : la différence correspond à son volume. Vous pouvez aussi saisir ce volume directement dans le calculateur." } },
          { "@type": "Question", "name": "Combien d'eau pour 1 kg de plâtre ?", "acceptedAnswer": { "@type": "Answer", "text": "À un ratio de 1,5, il faut environ 0,67 litre d'eau pour 1 kg de plâtre (1 ÷ ratio). À 1,3 comptez ~0,77 L, et à 1,8 environ 0,56 L. Le calculateur effectue ce calcul automatiquement pour le volume de votre moule." } }
        ]
      }
    </script>
