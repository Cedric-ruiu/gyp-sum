<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable — GypSum</title>
    <link rel="icon" type="image/svg+xml" href="/gyp-sum/favicon.svg" />
    <style>
      :root {
        --ink: #1a1a1a;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #2563eb;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          Inter, system-ui, -apple-system, sans-serif;
        font-weight: 300;
        color: var(--ink);
        background: #fff;
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      .code {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 3rem;
        font-weight: 300;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.125rem;
        font-weight: 500;
      }
      p {
        margin: 0.75rem 0 1.5rem;
        font-size: 0.875rem;
        line-height: 1.6;
        color: var(--muted);
      }
      a {
        display: inline-block;
        padding: 0.5rem 1rem;
        border: 1px solid var(--line);
        border-radius: 0.25rem;
        font-size: 0.8125rem;
        text-decoration: none;
        color: var(--accent);
        transition: border-color 0.15s;
      }
      a:hover {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>Page introuvable</h1>
      <p>Cette page n'existe pas ou a été déplacée.</p>
      <a href="/gyp-sum/">Retour au calculateur</a>
    </main>
  </body>
</html>
